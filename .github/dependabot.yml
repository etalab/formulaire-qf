version: 2
updates:
  - package-ecosystem: "bundler"
    groups:
      dsfr:
        patterns:
        - "dsfr-assets"
      production-dependencies:
        dependency-type: "production"
        exclude-patterns:
        - "dsfr-assets"
      development-dependencies:
        dependency-type: "development"
        exclude-patterns:
        - "rubocop*"
      rubocop:
        patterns:
        - "rubocop*"
    directory: "/"
    schedule:
      day: "monday"
      time: "01:00"
      interval: "weekly"
